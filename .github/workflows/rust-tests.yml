name: Rust tests

on:
  push:
    branches:
      - rewrite/rust
  pull_request:
    branches:
      - rewrite/rust
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: cargo test --all-targets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --all-targets
